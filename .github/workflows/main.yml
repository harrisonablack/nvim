name: StyLua format

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: StyLua check
      uses: JohnnyMorganz/stylua-action@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        version: latest
        args: --check .
